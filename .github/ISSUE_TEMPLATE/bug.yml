name: Bug report
description: Report a reproducible problem using fictional data.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior. Do not include credentials or private health information.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Commit, browser, operating system, Node version, local or hosted
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots
      description: Redact tokens, email addresses, and personal records.
